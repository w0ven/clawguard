x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - .env
    command:
      - sh
      - -ec
      - |
        cat >/tmp/redis-start.sh <<'REDIS_START'
        if [ -f /data/appendonlydir/appendonly.aof.manifest ]; then
          exec redis-server --requirepass "$${REDIS_PASSWORD}" --appendonly yes --appendfsync everysec
        fi

        redis-server --requirepass "$${REDIS_PASSWORD}" --appendonly no &
        redis_pid=$$!
        trap 'kill -TERM "$${redis_pid}" 2>/dev/null || true; wait "$${redis_pid}" || true' TERM INT EXIT

        until REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping >/dev/null 2>&1; do
          kill -0 "$${redis_pid}"
          sleep 0.1
        done
        REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli CONFIG SET appendonly yes >/dev/null

        until [ -f /data/appendonlydir/appendonly.aof.manifest ] &&
          persistence="$$(REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli INFO persistence)" &&
          printf '%s\n' "$${persistence}" | grep -q 'aof_rewrite_in_progress:0' &&
          printf '%s\n' "$${persistence}" | grep -q 'aof_rewrite_scheduled:0' &&
          printf '%s\n' "$${persistence}" | grep -q 'aof_last_bgrewrite_status:ok'; do
          kill -0 "$${redis_pid}"
          sleep 0.1
        done

        trap - EXIT
        wait "$${redis_pid}"
        REDIS_START
        chmod 0555 /tmp/redis-start.sh
        find /data ! -user redis -exec chown redis:redis '{}' +
        exec setpriv --reuid redis --regid redis --clear-groups sh /tmp/redis-start.sh
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping && REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli INFO persistence | grep -q 'aof_enabled:1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    pids_limit: 128
    mem_limit: 256m
    logging: *default-logging

  bot:
    image: kelework/clawguard-bot:${CLAWGUARD_TAG:?set CLAWGUARD_TAG in .env, e.g. sha-fe27a05}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      HTTP_PORT: 8080
      ASSISTANT_ENGINE: ${ASSISTANT_ENGINE:-legacy}
      ASSISTANT_NATIVE_URL: ${ASSISTANT_NATIVE_URL:-http://assistant-native:8091}
      ASSISTANT_BROKER_SECRET: ${ASSISTANT_BROKER_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O - http://127.0.0.1:8080/readyz 2>/dev/null | grep -q '\"status\":\"ready\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    pids_limit: 512
    mem_limit: 1g
    logging: *default-logging

  # Opt-in application unit only. Never load the full CG .env into Python.
  # Publisher enables this profile after the latest paused migration verifies.
  assistant-native:
    image: kelework/clawguard-assistant-native:${CLAWGUARD_TAG:?set accepted immutable application tag}
    profiles: ["native-assistant"]
    restart: unless-stopped
    environment:
      CG_BROKER_URL: http://bot:8080/internal/native
      ASSISTANT_BROKER_SECRET: ${ASSISTANT_BROKER_SECRET:-}
      CONFIG_MASTER_KEY: ${NATIVE_CONFIG_MASTER_KEY:-}
      NATIVE_DATA_DIR: /data
      NATIVE_PORT: 8091
      NATIVE_REQUIRE_MIGRATION: "true"
      TZ: Asia/Shanghai
    depends_on:
      bot:
        condition: service_healthy
    volumes:
      - assistant_native_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    pids_limit: 256
    mem_limit: 1g
    stop_grace_period: 90s
    logging: *default-logging

  web:
    image: kelework/clawguard-web:${CLAWGUARD_TAG:?set CLAWGUARD_TAG in .env, e.g. sha-fe27a05}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      INTERNAL_API: http://bot:8080
      NEXT_PUBLIC_BOT_USERNAME: ${BOT_USERNAME}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
    depends_on:
      bot:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /app/.next/cache:mode=1777
    pids_limit: 256
    mem_limit: 512m
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      bot:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    pids_limit: 128
    mem_limit: 256m
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
  assistant_native_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - .env
    command:
      - sh
      - -ec
      - |
        if [ -f /data/appendonlydir/appendonly.aof.manifest ]; then
          exec redis-server --requirepass "$${REDIS_PASSWORD}" --appendonly yes --appendfsync everysec
        fi

        redis-server --requirepass "$${REDIS_PASSWORD}" --appendonly no &
        redis_pid=$$!
        trap 'kill -TERM "$${redis_pid}" 2>/dev/null || true; wait "$${redis_pid}" || true' TERM INT EXIT

        until REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping >/dev/null 2>&1; do
          kill -0 "$${redis_pid}"
          sleep 0.1
        done
        REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli CONFIG SET appendonly yes >/dev/null

        until [ -f /data/appendonlydir/appendonly.aof.manifest ] &&
          persistence="$$(REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli INFO persistence)" &&
          printf '%s\n' "$${persistence}" | grep -q 'aof_rewrite_in_progress:0' &&
          printf '%s\n' "$${persistence}" | grep -q 'aof_rewrite_scheduled:0' &&
          printf '%s\n' "$${persistence}" | grep -q 'aof_last_bgrewrite_status:ok'; do
          kill -0 "$${redis_pid}"
          sleep 0.1
        done

        trap - EXIT
        wait "$${redis_pid}"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping && REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli INFO persistence | grep -q 'aof_enabled:1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    image: kelework/clawguard-bot:latest
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      HTTP_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  web:
    image: kelework/clawguard-web:latest
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      INTERNAL_API: http://bot:8080
      NEXT_PUBLIC_BOT_USERNAME: ${BOT_USERNAME}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
    depends_on:
      bot:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      bot:
        condition: service_started
      web:
        condition: service_started
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:

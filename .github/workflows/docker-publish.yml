name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: docker.io
  BOT_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/clawguard-bot
  WEB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/clawguard-web

jobs:
  test-bot:
    name: Test bot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clawguard_test
          POSTGRES_USER: clawguard
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clawguard -d clawguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: bot/go.mod
          cache-dependency-path: bot/go.sum
      - name: Unit tests
        working-directory: bot
        run: go test ./...
      - name: Vet
        working-directory: bot
        run: go vet ./...
      - name: Race tests
        working-directory: bot
        run: go test -race ./internal/bot ./internal/api ./internal/config ./internal/worker
      - name: Vulnerability scan
        working-directory: bot
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Migration smoke test
        working-directory: bot
        env:
          APP_ENV: development
          BOT_TOKEN: test-token
          BOT_USERNAME: test_bot
          TELEGRAM_LOGIN_BOT_USERNAME: test_bot
          WEBHOOK_SECRET: test-webhook
          PUBLIC_BASE_URL: http://localhost:8080
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_DB: clawguard_test
          POSTGRES_USER: clawguard
          POSTGRES_PASSWORD: test-password
          REDIS_HOST: 127.0.0.1
          JWT_SECRET: test-jwt
        run: go run ./cmd/migrate
      - name: PostgreSQL integration tests
        working-directory: bot
        env:
          TEST_DATABASE_URL: postgres://clawguard:test-password@127.0.0.1:5432/clawguard_test?sslmode=disable
        run: go test -tags=integration -timeout 180s ./internal/store ./internal/api

  test-web:
    name: Test web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Type check
        working-directory: web
        run: npx tsc --noEmit
      - name: Production dependency audit
        working-directory: web
        run: npm audit --omit=dev --audit-level=moderate
      - name: Build
        working-directory: web
        run: npm run build
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        working-directory: web
        run: npm run test:e2e

  test-runtime:
    name: Test runtime hardening
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Redis legacy persistence and privilege smoke test
        run: bash scripts/redis-hardening-smoke.sh

  build-and-push:
    name: Build ${{ matrix.service }}
    needs: [test-bot, test-web, test-runtime]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: bot
            context: ./bot
            image: clawguard-bot
          - service: web
            context: ./web
            image: clawguard-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          push: true
          no-cache: ${{ matrix.service == 'bot' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          build-args: |
            NEXT_PUBLIC_BOT_USERNAME=${{ vars.NEXT_PUBLIC_BOT_USERNAME }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
